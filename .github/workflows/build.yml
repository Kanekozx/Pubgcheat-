name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Setup NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8

      - name: Package Magisk zip
        run: |
          mkdir -p out/zygisk out/META-INF/com/google/android
          cp module.prop customize.sh out/
          cp META-INF/com/google/android/update-binary out/META-INF/com/google/android/
          cp build/libesp_internal.so out/zygisk/arm64-v8a.so
          cd out && zip -r ../esp-internal.zip . && cd ..
          ls -la esp-internal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-internal
          path: esp-internal.zip
          retention-days: 30
