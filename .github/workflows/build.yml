name: Build C++ Only

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

    - name: Build C++ Core
      run: |
        export NDK=$NDK_HOME
        export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
        export CXXFLAGS="-std=c++17 -O2 -fPIE -fvisibility=hidden"
        export LDFLAGS="-pie -pthread -llog -ldl"
        
        # Собираем только бинарник
        $CXX $CXXFLAGS -o pubg_cheat src/main.cpp src/module.cpp src/esp.cpp src/aimbot.cpp src/offsets.cpp src/overlay_null.cpp src/menu.cpp $LDFLAGS
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip pubg_cheat

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: CheatPackage
        path: pubg_cheat
