name: Build Android Cheat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

    - name: Download AOSP Headers and Libs
      run: |
        # Используем проверенный репозиторий, где есть папка gui
        git clone --depth 1 https://github.com/DevonCrawford/Android-SurfaceFlinger-Overlay.git temp_overlay
        mkdir -p include
        cp -r temp_overlay/app/src/main/cpp/include/* ./include/
        mkdir -p libs/arm64-v8a
        cp temp_overlay/app/src/main/jniLibs/arm64-v8a/*.so ./libs/arm64-v8a/

    - name: Build
      run: |
        export NDK=$NDK_HOME
        export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
        export CXXFLAGS="-std=c++20 -O2 -fPIE -fvisibility=hidden -I./include"
        export LDFLAGS="-pie -pthread -L./libs/arm64-v8a -L/system/lib64 -llog -ldl -lgui -lEGL -lGLESv3 -lbinder -lui -lutils"
        
        $CXX $CXXFLAGS -o pubg_cheat main.cpp module.cpp esp.cpp aimbot.cpp offsets.cpp overlay_egl.cpp menu.cpp $LDFLAGS
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip pubg_cheat

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: pubg_cheat
        path: pubg_cheat
