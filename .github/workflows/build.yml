name: Build Cheat and App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

    - name: Build C++ Core
      run: |
        export NDK=$NDK_HOME
        export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
        export CXXFLAGS="-std=c++17 -O2 -fPIE -fvisibility=hidden"
        export LDFLAGS="-pie -pthread -llog -ldl"
        
        # ВАЖНО: используем overlay_null.cpp вместо overlay_egl.cpp
        $CXX $CXXFLAGS -o pubg_cheat main.cpp module.cpp esp.cpp aimbot.cpp offsets.cpp overlay_null.cpp menu.cpp $LDFLAGS
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip pubg_cheat

    - name: Setup Gradle
      run: |
        echo "include ':app'" > settings.gradle
        echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
        echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

    - name: Setup App Module
      run: |
        mkdir -p app/src/main/java/com/cheat/overlay
        cp android_app/AndroidManifest.xml app/src/main/AndroidManifest.xml
        cp android_app/MainActivity.kt app/src/main/java/com/cheat/overlay/MainActivity.kt
        cp android_app/OverlayService.kt app/src/main/java/com/cheat/overlay/OverlayService.kt
        
        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "android { namespace 'com.cheat.overlay'; compileSdk 34; defaultConfig { applicationId 'com.cheat.overlay'; minSdk 26; targetSdk 34 } }" >> app/build.gradle

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.1.1
        ./gradlew assembleDebug

    - name: Upload Everything
      uses: actions/upload-artifact@v4
      with:
        name: CheatPackage
        path: |
          pubg_cheat
          app/build/outputs/apk/debug/app-debug.apk
