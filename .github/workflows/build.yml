name: Build Android Cheat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

    - name: Download Official AOSP Headers
      run: |
        # Используем стабильную ветку Android 11, где все пути предсказуемы
        git clone -b android-11.0.0_r1 --depth 1 https://android.googlesource.com/platform/frameworks/native temp_native
        git clone -b android-11.0.0_r1 --depth 1 https://android.googlesource.com/platform/system/core temp_core
        git clone -b android-11.0.0_r1 --depth 1 https://android.googlesource.com/platform/system/logging temp_logging
        
        mkdir -p include
        # Копируем нужные заголовки (в Android 11 libutils лежит в system/core)
        cp -r temp_native/libs/gui/include/* ./include/
        cp -r temp_native/libs/ui/include/* ./include/
        cp -r temp_native/libs/binder/include/* ./include/
        cp -r temp_core/libutils/include/* ./include/
        cp -r temp_core/libcutils/include/* ./include/
        cp -r temp_logging/liblog/include/* ./include/

    - name: Build
      run: |
        export NDK=$NDK_HOME
        export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
        export CXXFLAGS="-std=c++20 -O2 -fPIE -fvisibility=hidden -I./include"
        
        # -Wl,--allow-shlib-undefined позволяет линковаться к системным библиотекам телефона
        export LDFLAGS="-pie -pthread -Wl,--allow-shlib-undefined -L/system/lib64 -llog -ldl -lgui -lEGL -lGLESv3 -lbinder -lui -lutils -lcutils -landroid"
        
        $CXX $CXXFLAGS -o pubg_cheat main.cpp module.cpp esp.cpp aimbot.cpp offsets.cpp overlay_egl.cpp menu.cpp $LDFLAGS
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip pubg_cheat

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: pubg_cheat
        path: pubg_cheat
