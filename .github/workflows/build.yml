name: Build Cheat and App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

    - name: Build C++ Core
      run: |
        export NDK=$NDK_HOME
        export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
        export CXXFLAGS="-std=c++17 -O2 -fPIE -fvisibility=hidden"
        export LDFLAGS="-pie -pthread -llog -ldl"
        
        $CXX $CXXFLAGS -o pubg_cheat src/main.cpp src/module.cpp src/esp.cpp src/offsets.cpp src/overlay_null.cpp src/menu.cpp $LDFLAGS
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip pubg_cheat

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.1

    - name: Setup Project Files
      run: |
        echo "include ':app'" > settings.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        mkdir -p app/src/main/java/com/cheat/overlay
        cp android_app/AndroidManifest.xml app/src/main/AndroidManifest.xml
        cp android_app/MainActivity.kt app/src/main/java/com/cheat/overlay/MainActivity.kt
        cp android_app/OverlayService.kt app/src/main/java/com/cheat/overlay/OverlayService.kt
        
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.cheat.overlay'
            compileSdk 33
            defaultConfig {
                applicationId 'com.cheat.overlay'
                minSdk 26
                targetSdk 33
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
        }
        EOF

    - name: Build APK
      run: |
        gradle assembleDebug

    - name: Upload Everything
      uses: actions/upload-artifact@v4
      with:
        name: CheatPackage
        path: |
          pubg_cheat
          app/build/outputs/apk/debug/app-debug.apk
