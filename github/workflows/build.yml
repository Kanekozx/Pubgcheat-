name: Build Internal SO

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

    - name: Clone ImGui and Dobby
      run: |
        git clone --depth 1 https://github.com/ocornut/imgui.git
        git clone --depth 1 https://github.com/jmpews/Dobby.git

    - name: Build with CMake
      run: |
        export PATH=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Upload libmain.so
      uses: actions/upload-artifact@v4
      with:
        name: libmain.so
        path: build/libmain.so
